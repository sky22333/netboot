# Alpine 3.23（virt / LTS）
# 用法：setup-alpine -f https://example.com/alpine-answers.conf

# 基础设置
KEYMAPOPTS="us us"
HOSTNAMEOPTS="alpine"
DEVDOPTS="mdev"
TIMEZONEOPTS="Asia/Shanghai"
PROXYOPTS="none"

# 自动 DHCP，失败后手动配置
INTERFACESOPTS=""
if setup-interfaces -ar; then
    INTERFACESOPTS="none"
fi

# 国内源：main + community
APKREPOSOPTS="https://mirrors.cernet.edu.cn/alpine/v3.23/main https://mirrors.cernet.edu.cn/alpine/v3.23/community"

# 时间同步和 SSH
NTPOPTS="busybox"
SSHDOPTS="openssh"

# 仅用 root，密码手动设置，无公钥
USEROPTS="none"
ROOTSSHKEY="none"

# 允许 root SSH 密码登录
mkdir -p /etc/ssh/sshd_config.d || exit 1
cat > /etc/ssh/sshd_config.d/00-netboot.conf <<'EOF' || exit 1
PermitRootLogin yes
PasswordAuthentication yes
EOF

# 硬盘安装，无 swap，手动选盘并确认
DISKOPTS="-m sys -s 0"

# 跳过无盘持久化
LBUOPTS="none"
APKCACHEOPTS="none"
